# 只编排应用服务。MySQL 由 deploy-mysql.sh 单独启动。
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: our-pact-backend
    ports:
      - "8080:8080"
    environment:
      MYSQL_HOST: host.docker.internal
      MYSQL_PORT: "3306"
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ourpact123
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: our-pact-nginx
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/web/dist:/usr/share/nginx/html/web:ro
      - ./frontend/h5/dist:/usr/share/nginx/html/h5:ro
    depends_on:
      - backend
    restart: unless-stopped
