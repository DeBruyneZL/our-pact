# 只编排应用服务。MySQL 由 deploy-mysql.sh 单独启动。
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: our-pact-backend
    # 与宿主机共用网络，才能用 127.0.0.1 连到本机 MySQL 的 3306
    network_mode: host
    environment:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ourpact123
      # 线上走 nginx 同源代理，浏览器带 https 的 Origin
      CORS_ORIGINS: https://kivenlpp.cn
      AVATAR_DIR: /data/our-pact/avatars
      DISH_IMAGE_DIR: /data/our-pact/dishes
      ACTIVITY_DIR: /data/our-pact/activities
    # 宿主机网络不影响卷挂载。头像、菜品图、活动照片落在服务器目录，重建容器不会丢文件
    volumes:
      - /data/our-pact/avatars:/data/our-pact/avatars
      - /data/our-pact/dishes:/data/our-pact/dishes
      - /data/our-pact/activities:/data/our-pact/activities
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: docker/nginx.Dockerfile
    container_name: our-pact-nginx
    ports:
      - "80:80"
      - "443:443"
    # TLS 证书放宿主机 /data/our-pact/nginx/certs，只读挂进容器
    volumes:
      - /data/our-pact/nginx/certs:/etc/nginx/certs:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend
    restart: unless-stopped
