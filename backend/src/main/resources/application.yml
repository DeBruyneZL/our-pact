server:
  port: 8080

spring:
  application:
    name: our-pact-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 服务和 MySQL 在同一台机器。deploy-mysql.sh 已把 3306 映射到宿主机。
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/our_pact_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:ourpact123}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 头像目录。Docker 中由 AVATAR_DIR 指到挂载进来的宿主机目录
app:
  avatar:
    dir: ${AVATAR_DIR:${user.home}/our-pact/avatars}
  dish:
    dir: ${DISH_IMAGE_DIR:${user.home}/our-pact/dishes}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}
  # 微信小程序登录凭证，mp.weixin.qq.com「开发管理-开发设置」里获取
  wxapp:
    app-id: ${WX_APP_ID:}
    app-secret: ${WX_APP_SECRET:}

# 令牌放在请求头 Authorization，前端登录后原样回传
sa-token:
  token-name: Authorization
  timeout: 86400
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: true
  is-read-header: true
  is-read-cookie: false

logging:
  level:
    com.kiven.lpp.ourpact: info
