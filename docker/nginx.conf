user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    charset utf-8;
    client_max_body_size 16m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    upstream our_pact_backend {
        # 后端使用宿主机网络，监听本机 8080
        server host.docker.internal:8080;
    }

    # 80 全部跳转 https
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name kivenlpp.cn www.kivenlpp.cn;

        # 证书挂载在宿主机 /data/our-pact/nginx/certs
        ssl_certificate /etc/nginx/certs/kivenlpp.cn.pem;
        ssl_certificate_key /etc/nginx/certs/kivenlpp.cn.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # 接口统一转到 Spring Boot，保留原始 /api 前缀
        location /api/ {
            proxy_pass http://our_pact_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
        }

        # Web 管理端
        location / {
            root /usr/share/nginx/html/web;
            location = /index.html {
                root /usr/share/nginx/html/web;
                add_header Cache-Control "no-store";
            }
            try_files $uri $uri/ /index.html;
        }
    }
}
